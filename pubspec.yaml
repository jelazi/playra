name: playra
description: "Playra - cross-platform video player with subtitle management."
publish_to: 'none'

version: 2.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP requests / parsing (kept for legacy subtitle workflow)
  http: ^1.2.2
  dio: ^5.7.0
  html: ^0.15.4

  # Video player
  video_player: ^2.9.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4

  # File & path utilities
  file_picker: ^8.1.4
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  package_info_plus: ^8.1.1
  crypto: ^3.0.6

  # Localization
  easy_localization: ^3.0.7

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Drag & drop / archives (legacy subtitle workflow)
  desktop_drop: ^0.7.0
  archive: ^4.0.7

  # Player UX – wakelock, brightness, volume, permissions
  wakelock_plus: ^1.2.8
  screen_brightness: ^2.1.11
  flutter_volume_controller: ^2.0.1
  permission_handler: ^11.3.1
  window_manager: ^0.5.1

  # Network servers (SMB browsing + local HTTP streaming proxy)
  smb_connect: ^0.0.9
  shelf: ^1.4.1
  shelf_router: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
